; VCSNative default DirectX 12 performance configuration.
; Uses asynchronous GE execution, the cross-unit AOT hot-register cache, native
; indexed/strip submission, packed 0x0115 GPU decode, hardware culling and batch
; merging. Visual/input/audio follow-ups remain tracked separately under the local
; progress directory.
[Display]
Enabled=true
; Output resolution mode: PSP | Desktop | Custom
;   PSP     = 480x272 logical output
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses Width and Height below
ResolutionMode=Desktop
; Used by ResolutionMode=Custom. Valid ranges: Width 320-16384, Height 180-16384.
Width=1920
Height=1080
; Fullscreen=true uses a borderless desktop-sized window. In that mode Width/Height
; still define the Custom logical output size, but the window itself fills the desktop.
Fullscreen=true
AspectRatio=Stretch
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=false
; Present on the monitor's vertical blank (no tearing). The sync interval follows
; how many PSP vblanks each frame spanned, so 30 FPS on 60 Hz holds every frame for
; exactly two refreshes. Falls back to interval 1 when the ratio is not whole.
VSync=true

[Rendering]
Backend=DirectX12
HardwareTransform=true
DX12GEColor=true
TextureCacheEntries=8192
TextureCacheMB=512
; Internal render resolution mode: PSP | Scale | Desktop | Custom
;   PSP     = native 480x272 rendering
;   Scale   = 480x272 multiplied by InternalScale (1-8)
;   Desktop = current Windows desktop/monitor resolution
;   Custom  = uses InternalWidth and InternalHeight below
InternalResolutionMode=Desktop
; Used only by InternalResolutionMode=Scale.
InternalScale=2
; Used only by InternalResolutionMode=Custom.
; Valid ranges: InternalWidth 480-16384, InternalHeight 272-16384.
InternalWidth=1920
InternalHeight=1080
MSAA=1
SMAA=false
AnisotropicFiltering=1
DepthPrecision=24
ExperimentalGpuColorPreview=false
GeometryDebugColors=false
DumpGpuFrameVblank=0

[Timing]
FrameRate=120
RealtimeSpeedDiagnostics=false
RealtimeSpeedIntervalVblanks=240

[Audio]
Enabled=true
Volume=100
Diagnostics=false
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
Enabled=true
AspectRatio=auto

[Project2DFX]
Enabled=false
PerformanceLog=false

[SimulateHDR]
Enabled=false

[DrawDistance]
Enabled=false
World=1.00
Vehicles=1.00
NPCs=1.00

[Controls]
CameraStick=true
MouseSensitivity=12
InvertCameraY=false
PedCameraUpLimitDegrees=10
ModernControlScheme=false

[Diagnostics]
LogToFile=true
LogFile=VCSNative.log
FlushEveryLine=false

[HudTextures]
; 2D interface (HUD/menu/font) texture enhancement at upload time.
; Off    = original PSP art, unchanged
; Smooth = Catmull-Rom upscale + transparent-edge colour bleed + mipmaps
; Sharp  = Smooth + sharpened strong edges on glyphs/outlines (recommended)
Filter=Sharp
; Maximum upscale (2-4). Also bounded by the internal resolution and 1024 px per side.
MaxScale=4
; Dump=true writes each 2D texture once to <Directory>\dump\<hash>.dds
Dump=false
; Replace=true uses <Directory>\<hash>.dds (any subfolder except dump) instead of
; the game texture. Same aspect ratio as the original; uncompressed 32-bit DDS.
Replace=false
Directory=TexturesHD
; LRU cache of finished results, keyed by texture content. Some HUD images are
; re-sent under new texture keys every frame; this skips re-upscaling them.
; The least recently used entries are dropped past either limit (0 = off).
CacheEntries=256
CacheMB=128
